<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booster AI | Alpha Booster</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0f;
            height: 100vh;
            overflow: hidden;
        }
        
        .app {
            display: flex;
            height: 100vh;
        }
        
        .sidebar {
            width: 260px;
            background: rgba(10, 10, 15, 0.95);
            border-right: 1px solid rgba(59, 130, 246, 0.15);
            display: flex;
            flex-direction: column;
            padding: 24px 16px;
            gap: 24px;
        }
        
        .logo {
            text-align: center;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(59, 130, 246, 0.15);
        }
        
        .logo h2 {
            font-size: 1.4rem;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .logo p {
            font-size: 0.7rem;
            color: #5b6e8c;
            margin-top: 6px;
        }
        
        .status {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 30px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.75rem;
            color: #4ade80;
        }
        
        .status .dot {
            width: 8px;
            height: 8px;
            background: #4ade80;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .features {
            flex: 1;
        }
        
        .feature-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            color: #8b9dbb;
            font-size: 0.8rem;
        }
        
        .feature-item i {
            width: 28px;
            color: #3b82f6;
        }
        
        .clear-btn {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            padding: 10px;
            border-radius: 30px;
            width: 100%;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }
        
        .clear-btn:hover {
            background: rgba(239, 68, 68, 0.2);
        }
        
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0f0f14;
        }
        
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .messages::-webkit-scrollbar {
            width: 5px;
        }
        
        .messages::-webkit-scrollbar-track {
            background: #1a1a24;
        }
        
        .messages::-webkit-scrollbar-thumb {
            background: #3b82f6;
            border-radius: 10px;
        }
        
        .message {
            display: flex;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.user {
            justify-content: flex-end;
        }
        
        .message.bot {
            justify-content: flex-start;
        }
        
        .bubble {
            max-width: 75%;
            padding: 12px 18px;
            border-radius: 20px;
            font-size: 0.9rem;
            line-height: 1.5;
        }
        
        .user .bubble {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border-bottom-right-radius: 4px;
        }
        
        .bot .bubble {
            background: #1a1a24;
            color: #e2e8f0;
            border-bottom-left-radius: 4px;
            border: 1px solid #2a2a35;
        }
        
        .typing-cursor {
            display: inline-block;
            width: 2px;
            height: 18px;
            background: #60a5fa;
            margin-left: 2px;
            animation: blink 1s infinite;
            vertical-align: middle;
        }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        
        .bubble pre {
            margin: 8px 0;
            border-radius: 10px;
            overflow-x: auto;
        }
        
        .bubble code {
            font-size: 0.75rem;
        }
        
        .chat-image {
            max-width: 200px;
            border-radius: 12px;
            margin: 6px 0;
            cursor: pointer;
        }
        
        .input-container {
            padding: 20px 32px 28px;
            background: #0f0f14;
            border-top: 1px solid #1a1a24;
        }
        
        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            background: #1a1a24;
            border-radius: 28px;
            padding: 6px 6px 6px 20px;
            border: 1px solid #2a2a35;
            transition: all 0.2s;
        }
        
        .input-wrapper:focus-within {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }
        
        .input-wrapper textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            resize: none;
            outline: none;
            padding: 10px 0;
            max-height: 80px;
        }
        
        .input-wrapper textarea::placeholder {
            color: #4a5568;
        }
        
        .action-buttons {
            display: flex;
            gap: 6px;
        }
        
        .action-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #252530;
            border: none;
            color: #8b9dbb;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .action-btn:hover {
            background: #3b82f6;
            color: white;
        }
        
        .send-btn {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            padding: 8px 22px;
            border-radius: 30px;
            border: none;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .send-btn:hover {
            transform: scale(1.02);
        }
        
        .recording {
            background: #ef4444 !important;
            color: white !important;
            animation: pulseRed 1s infinite;
        }
        
        @keyframes pulseRed {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .attachments-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }
        
        .attach-badge {
            background: #1a1a24;
            border: 1px solid #2a2a35;
            border-radius: 20px;
            padding: 5px 12px;
            font-size: 0.7rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #8b9dbb;
        }
        
        .attach-badge button {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
        }
        
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .bubble { max-width: 85%; }
            .messages { padding: 16px; }
            .input-container { padding: 16px; }
        }
    </style>
</head>
<body>

<div class="app">
    <div class="sidebar">
        <div class="logo">
            <h2><i class="fas fa-bolt"></i> Booster AI</h2>
            <p>Alpha Booster · Rwanda IMG</p>
        </div>
        
        <div class="status">
            <span class="dot"></span>
            <span>Llama 3.3 · Groq</span>
        </div>
        
        <div class="features">
            <div class="feature-item"><i class="fas fa-microphone"></i><span>Voice input</span></div>
            <div class="feature-item"><i class="fas fa-file-alt"></i><span>Reads DOCX, PDF, TXT</span></div>
            <div class="feature-item"><i class="fas fa-brain"></i><span>Conversation memory</span></div>
            <div class="feature-item"><i class="fas fa-code"></i><span>Code highlighting</span></div>
        </div>
        
        <button class="clear-btn" id="clearHistoryBtn"><i class="fas fa-trash-alt"></i> Clear chat</button>
    </div>
    
    <div class="chat-main">
        <div class="messages" id="messages">
            <div class="message bot">
                <div class="bubble">Hey! 👋 How can I help you today?</div>
            </div>
        </div>
        
        <div class="input-container">
            <div id="attachmentsPreview" class="attachments-preview"></div>
            
            <div class="input-wrapper">
                <textarea id="messageInput" rows="1" placeholder="Type your message..."></textarea>
                <div class="action-buttons">
                    <button class="action-btn" id="imageBtn" title="Upload image"><i class="fas fa-image"></i></button>
                    <button class="action-btn" id="fileBtn" title="Upload file"><i class="fas fa-paperclip"></i></button>
                    <button class="action-btn" id="voiceBtn" title="Voice message"><i class="fas fa-microphone"></i></button>
                    <button class="send-btn" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>
</div>

<input type="file" id="imageInput" accept="image/*" multiple style="display:none">
<input type="file" id="fileInput" accept=".docx,.pdf,.txt,.py,.js,.html,.css,.json,.md" multiple style="display:none">

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
    // ============================================
    // FIXED: Updated to use your hosted backend URL
    // ============================================
    const API_URL = 'https://booster-ai-1.onrender.com';
    
    const messagesDiv = document.getElementById('messages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const imageBtn = document.getElementById('imageBtn');
    const fileBtn = document.getElementById('fileBtn');
    const voiceBtn = document.getElementById('voiceBtn');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');
    const attachmentsPreview = document.getElementById('attachmentsPreview');
    
    let attachments = [];
    let sessionId = 'session_' + Date.now();
    let mediaRecorder = null;
    let isRecording = false;
    let audioChunks = [];
    
    messageInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 80) + 'px';
    });
    
    async function addMessageWithTyping(text, isUser, imageData = null, fileName = null) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;
        
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        
        let content = '';
        
        if (imageData) {
            content += `<img src="${imageData}" class="chat-image" onclick="window.open(this.src)">`;
        }
        
        if (fileName) {
            content += `<div style="display: flex; align-items: center; gap: 6px; background: rgba(59,130,246,0.2); padding: 5px 10px; border-radius: 12px; margin-bottom: 8px; font-size: 0.75rem;">
                <i class="fas fa-paperclip"></i> ${fileName}
            </div>`;
        }
        
        content += '<span id="typingText"></span><span class="typing-cursor"></span>';
        
        bubble.innerHTML = content;
        messageDiv.appendChild(bubble);
        messagesDiv.appendChild(messageDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        
        const typingSpan = bubble.querySelector('#typingText');
        
        if (!isUser && text) {
            let i = 0;
            const speed = 15;
            while (i < text.length) {
                typingSpan.textContent += text[i];
                i++;
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
                await new Promise(resolve => setTimeout(resolve, speed));
            }
        } else if (text) {
            typingSpan.textContent = text;
        }
        
        const cursor = bubble.querySelector('.typing-cursor');
        if (cursor) cursor.remove();
        
        let formatted = bubble.innerHTML;
        formatted = formatted.replace(/```(\w*)\n([\s\S]*?)```/g, (match, lang, code) => {
            return `<pre><code class="language-${lang || 'plaintext'}">${escapeHtml(code)}</code></pre>`;
        });
        bubble.innerHTML = formatted;
        
        document.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
    }
    
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    function addMessage(text, isUser, imageData = null, fileName = null) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;
        
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        
        let content = '';
        
        if (imageData) {
            content += `<img src="${imageData}" class="chat-image" onclick="window.open(this.src)">`;
        }
        
        if (fileName) {
            content += `<div style="display: flex; align-items: center; gap: 6px; background: rgba(59,130,246,0.2); padding: 5px 10px; border-radius: 12px; margin-bottom: 8px; font-size: 0.75rem;">
                <i class="fas fa-paperclip"></i> ${fileName}
            </div>`;
        }
        
        let formatted = text;
        formatted = formatted.replace(/```(\w*)\n([\s\S]*?)```/g, (match, lang, code) => {
            return `<pre><code class="language-${lang || 'plaintext'}">${escapeHtml(code)}</code></pre>`;
        });
        
        content += formatted;
        bubble.innerHTML = content;
        messageDiv.appendChild(bubble);
        messagesDiv.appendChild(messageDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        
        document.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
    }
    
    function showTyping() {
        const typingDiv = document.createElement('div');
        typingDiv.className = 'message bot';
        typingDiv.id = 'typingIndicator';
        typingDiv.innerHTML = `<div class="bubble" style="padding: 10px 16px;"><span class="typing-cursor" style="animation: blink 1s infinite;"></span></div>`;
        messagesDiv.appendChild(typingDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
    
    function removeTyping() {
        const el = document.getElementById('typingIndicator');
        if (el) el.remove();
    }
    
    function updatePreview() {
        if (attachments.length === 0) {
            attachmentsPreview.innerHTML = '';
            return;
        }
        attachmentsPreview.innerHTML = attachments.map((att, idx) => `
            <div class="attach-badge">
                <i class="fas ${att.type === 'image' ? 'fa-image' : 'fa-file'}"></i>
                ${att.name.substring(0, 20)}
                <button onclick="removeAttachment(${idx})"><i class="fas fa-times"></i></button>
            </div>
        `).join('');
    }
    
    function removeAttachment(idx) {
        attachments.splice(idx, 1);
        updatePreview();
    }
    window.removeAttachment = removeAttachment;
    
    imageBtn.onclick = () => document.getElementById('imageInput').click();
    document.getElementById('imageInput').addEventListener('change', (e) => {
        Array.from(e.target.files).forEach(file => {
            const reader = new FileReader();
            reader.onload = (event) => {
                attachments.push({ type: 'image', data: event.target.result, name: file.name });
                updatePreview();
            };
            reader.readAsDataURL(file);
        });
        e.target.value = '';
    });
    
    fileBtn.onclick = () => document.getElementById('fileInput').click();
    document.getElementById('fileInput').addEventListener('change', (e) => {
        Array.from(e.target.files).forEach(file => {
            const reader = new FileReader();
            reader.onload = (event) => {
                attachments.push({ type: 'file', data: event.target.result, name: file.name });
                updatePreview();
            };
            reader.readAsDataURL(file);
        });
        e.target.value = '';
    });
    
    voiceBtn.onclick = async () => {
        if (!isRecording) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const blob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.onload = () => {
                        attachments.push({ type: 'audio', data: reader.result, name: 'voice.webm' });
                        updatePreview();
                    };
                    reader.readAsDataURL(blob);
                    stream.getTracks().forEach(track => track.stop());
                };
                mediaRecorder.start();
                isRecording = true;
                voiceBtn.classList.add('recording');
                voiceBtn.innerHTML = '<i class="fas fa-stop"></i>';
                setTimeout(() => {
                    if (isRecording) {
                        mediaRecorder.stop();
                        isRecording = false;
                        voiceBtn.classList.remove('recording');
                        voiceBtn.innerHTML = '<i class="fas fa-microphone"></i>';
                    }
                }, 30000);
            } catch (err) {
                addMessage("❌ Microphone access denied.", false);
            }
        } else {
            mediaRecorder.stop();
            isRecording = false;
            voiceBtn.classList.remove('recording');
            voiceBtn.innerHTML = '<i class="fas fa-microphone"></i>';
        }
    };
    
    // ============================================
    // FIXED: Using API_URL variable for all fetch calls
    // ============================================
    clearHistoryBtn.onclick = async () => {
        try {
            await fetch(`${API_URL}/clear-history`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_id: sessionId })
            });
            messagesDiv.innerHTML = '';
            addMessage("Chat cleared! 👋", false);
        } catch (error) {}
    };
    
    async function sendMessage() {
        const message = messageInput.value.trim();
        if (!message && attachments.length === 0) return;
        
        const images = attachments.filter(a => a.type === 'image');
        const files = attachments.filter(a => a.type !== 'image');
        
        if (images.length) {
            addMessage(message || '📷 Image', true, images[0]?.data, null);
        } else if (files.length) {
            addMessage(message || `📎 ${files[0].name}`, true, null, files[0]?.name);
        } else {
            addMessage(message, true);
        }
        
        messageInput.value = '';
        messageInput.style.height = 'auto';
        const currentAttachments = [...attachments];
        attachments = [];
        updatePreview();
        
        showTyping();
        
        try {
            // FIXED: Using the hosted backend URL
            const response = await fetch(`${API_URL}/chat`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: message,
                    files: currentAttachments,
                    session_id: sessionId
                })
            });
            
            removeTyping();
            const data = await response.json();
            
            if (data.error) {
                addMessage(`❌ ${data.error}`, false);
            } else {
                await addMessageWithTyping(data.reply, false);
            }
        } catch (error) {
            removeTyping();
            addMessage(`❌ Cannot connect to backend. Please make sure the server is running.`, false);
        }
    }
    
    sendBtn.onclick = sendMessage;
    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });
</script>
</body>
</html>
